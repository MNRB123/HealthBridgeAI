version: "3.9"

# ─── HealthBridge AI — Docker Compose ────────────────────────────────────────
# Demo application — not for production use
#
# Usage:
#   docker compose up --build          # build and start
#   docker compose up -d               # start in background
#   docker compose down                # stop and remove containers
#   docker compose logs -f backend     # follow backend logs

services:

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthbridge-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # App
      - APP_NAME=HealthBridge AI
      - APP_ENV=development
      - DEBUG=true
      # Security — override with a real secret in production
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      # Database (SQLite stored in named volume)
      - DATABASE_URL=sqlite:///./data/healthbridge.db
      # OpenAI — set your key in .env at the project root
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-not-set}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      # CORS — allow the Vite dev server and any local origin
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://localhost:4173"]
    volumes:
      # Persist the SQLite database across container restarts
      - db_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - healthbridge

  # ── Frontend (Vite preview — optional) ──────────────────────────────────────
  # Uncomment this block to run the built frontend inside Docker too.
  # For active development, run `npm run dev` directly instead.
  #
  # frontend:
  #   build:
  #     context: ./
  #     dockerfile: Dockerfile.frontend
  #   container_name: healthbridge-ui
  #   restart: unless-stopped
  #   ports:
  #     - "4173:4173"
  #   depends_on:
  #     - backend
  #   networks:
  #     - healthbridge

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  db_data:
    driver: local
    name: healthbridge_db

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  healthbridge:
    driver: bridge
    name: healthbridge_network
